[project]
name = "pmo-assistant"
version = "0.1.0"
description = "Assistente de IA para PMO: extração de ações, análise de cronograma e saúde de projeto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "streamlit>=1.40.0",
    "loguru>=0.7.2",
    "typer>=0.13.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmo_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TCH", "PL", "RUF"]
ignore = ["PLR0913", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "E501"]
"src/pmo_assistant/core/prompts/*" = ["E501"]
"src/pmo_assistant/core/parsers/*" = ["PLR2004"]  # indices posicionais de datas

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/pmo_assistant/core"]

[[tool.mypy.overrides]]
module = ["src.pmo_assistant.infra.*", "src.pmo_assistant.ui.*"]
disallow_untyped_defs = false
